// Top-level build file. Versions match Aiwidget's android/build.gradle to keep
// signature-level permission compatibility easy.
buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 31
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "29.0.14206865"
        // 2.3.0 needed: LiteRT-LM 0.11.0 ships Kotlin metadata 2.3.0; the
        // 2.1.10 compiler only reads metadata up to 2.2.0. Aiwidget can stay
        // on 2.1.10 — AIDL is generated Java, not Kotlin, so the cross-APK
        // contract is unaffected by the Kotlin version drift.
        kotlinVersion = "2.3.0"
        agpVersion = "8.9.1"
    }
}

plugins {
    id 'com.android.application' version "$agpVersion" apply false
    id 'org.jetbrains.kotlin.android' version "$kotlinVersion" apply false
}
