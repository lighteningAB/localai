plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nothing.localai'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.nothing.localai"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"

        // Snapdragon-only at the moment; restrict ABIs to keep APK lean.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        aidl true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/DEPENDENCIES'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // LiteRT-LM 0.11.0 — experiment branch. Swapping back from MediaPipe
    // tasks-genai to chase Gemma 4 E4B multimodal. 0.11.0 adds Gemma 4 MTP
    // (>2x faster GPU decode). No public NPU-specialized .litertlm exists for
    // SM8735 (Snapdragon 8s Gen 4) yet, so we run the generic bundle on the
    // GPU backend — same accel tier as MediaPipe, isolating the question to
    // "does the multimodal vision path SIGSEGV like 0.10.2 did?"
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.11.0'
    // OkHttp for model download
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
